name: Bug report
description: Report a problem with the RF Fan integration
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Please fill in as much of the form as
        possible - it is what makes an issue diagnosable without a round trip.

        Before you continue, check [Known limitations](https://github.com/dasimon135/ha-rf-fan#known-limitations).
        This integration replays codes it cannot verify, so several reported problems are documented behaviour rather than defects.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem, what you expected instead, and how to reproduce it.
    validations:
      required: true
  - type: input
    id: ha-version
    attributes:
      label: Home Assistant version
      description: Settings -> About (e.g. 2026.8.2)
      placeholder: "2026.8.2"
    validations:
      required: true
  - type: input
    id: integration-version
    attributes:
      label: RF Fan version
      description: HACS -> RF Fan (e.g. 1.9.1)
      placeholder: "1.9.1"
    validations:
      required: true
  - type: textarea
    id: hardware
    attributes:
      label: Gateway and fan
      description: |
        Gateway board and RF module (e.g. ESP32 + CC1101) with its ESPHome version, the fan or remote model, and the frequency it works on.
      placeholder: |
        ESP32-WROOM + CC1101 on ESPHome 2026.8.2
        Cecotec EnergySilence Aero 5200, 433.92 MHz
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: |
        Settings -> Devices & services -> RF Fan -> entry menu (...) -> Download diagnostics.
        Attach the file or paste its content here.
      placeholder: Drag and drop the diagnostics JSON file here.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Home Assistant logs related to the issue (Settings -> System -> Logs, filter on "rf_fan").
      render: text
    validations:
      required: false
