# RF Fan gateway: legacy single-pin configuration.
#
# Kept for setups already wired with GDO0 shared between receive and transmit.
# For a NEW build, use rf_fan_example.yaml instead: it has separate RX/TX pins,
# which avoids a pin-mode conflict that can leave the receiver permanently deaf
# on ESP32.
#
# The file name is kept so existing links still work, but this config no longer
# uses RadioLib. The juanboro/esphome-radiolib-cc1101 component pulls RadioLib
# unpinned, and RadioLib stopped compiling against the ESP-IDF that ESPHome
# ships (`driver/ledc.h: No such file or directory`). It now runs on ESPHome's
# built-in cc1101: component. The wiring is unchanged: that component drives
# GDO0 as serial data in both directions (IOCFG0 = 0x0D), so one pin still
# carries both. Do NOT declare gdo0_pin: it is for packet mode only, and its
# interrupt would fight remote_receiver over the same pin.

substitutions:
  device_name: rf-fan-gateway
  friendly_name: RF fan gateway
  # RF frequency of the remote (MHz). Start at 433.92 and adjust if
  # the sniff captures nothing (try 433.42, 434.42...).
  cc1101_frequency: "433.92"

  # Frame geometry. rc_switch reports a decoded frame as a 64-bit integer and
  # DISCARDS the bit length, so it has to be declared here — exactly, because
  # transmit_rc_switch_raw derives the frame length from the string length.
  # Read both values off the `dump: rc_switch` log line:
  #   Received RCSwitch Raw: protocol=1 data='000100110101...'
  rc_protocol: "1"
  rc_code_bits: "24"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: -100
    then:
      # The radio must be strobed into RX explicitly, otherwise nothing is
      # received until the first transmission has happened.
      - cc1101.begin_rx: mycc1101

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret rf_fan_api_key
  services:
    - service: transmit_rf_fan
      variables:
        action: string
        code: string
        repeat_count: int
      then:
        - remote_transmitter.transmit_rc_switch_raw:
            transmitter_id: rf_transmitter
            # Codes are stored as "<protocol>:<bits>"; transmit_rc_switch_raw
            # wants the bare bit string (every character counts as one bit).
            code: !lambda |-
              const std::string raw = code;
              const size_t sep = raw.find(':');
              return sep == std::string::npos ? raw : raw.substr(sep + 1);
            # NOTE: `protocol: N` transmits with protocol N's STOCK timings,
            # which are often not your remote's. That the receiver above
            # decodes protocol N proves nothing here — it runs at
            # `tolerance: 50%` and your fan does not. If replays are ignored,
            # replace this line with an inline block: YOUR measured unit, and
            # everything else copied from protocol N's row. For protocol 1:
            #
            #   protocol:
            #     pulse_length: 350   # your remote's short pulse, in µs
            #     sync: [1, 31]
            #     zero: [1, 3]
            #     one: [3, 1]
            #     inverted: false
            #
            # Any other protocol has other ratios, and protocol 6 is
            # `inverted: true`: take N's row from the table under "The fan
            # ignores a code that was learned correctly" in the README. A row
            # copied from another protocol sends a frame your fan ignores.
            protocol: ${rc_protocol}
            repeat:
              times: !lambda "return repeat_count;"
              wait_time: 10ms

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  fast_connect: true
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret rf_fan_fallback_password

captive_portal:

web_server:
  port: 80

# Standard ESP32 SPI (VSPI)
spi:
  id: spi_bus
  type: single
  clk_pin: GPIO18
  mosi_pin: GPIO23
  miso_pin: GPIO19

# CC1101 blue module wiring (standard 8-pin)
# Pin 1 VCC→3V3 | Pin 2 GND→GND | Pin 3 MOSI→D23 | Pin 4 SCLK→D18
# Pin 5 MISO→D19 | Pin 6 GDO2→(unused) | Pin 7 GDO0→D4 | Pin 8 CSN→D5
#
# Same radio settings as the RadioLib version: 464 kHz filter, 5 kBaud.
cc1101:
  id: mycc1101
  cs_pin: 5
  frequency: ${cc1101_frequency}MHz
  output_power: 10
  modulation_type: ASK/OOK
  symbol_rate: 5000
  filter_bandwidth: 464kHz

# RF transmitter on GDO0 (GPIO4) — switches the CC1101 to TX then back to RX
remote_transmitter:
  - id: rf_transmitter
    pin:
      number: 4
      allow_other_uses: true
    carrier_duty_percent: 100%
    non_blocking: false
    on_transmit:
      then:
        - cc1101.begin_tx: mycc1101
    on_complete:
      then:
        - cc1101.begin_rx: mycc1101

# RF receiver on GDO0 (GPIO4) — sniffs and publishes to Home Assistant
remote_receiver:
  - id: rf_receiver
    pin:
      number: 4
      allow_other_uses: true
    tolerance: 50%
    filter: 100us
    idle: 4ms
    # Keep this on until guided learning works: it is the only place that
    # prints the protocol number and the true bit length. Set it to [] after.
    dump: rc_switch
    on_rc_switch:
      then:
        - if:
            condition:
              api.connected:
            then:
              - homeassistant.event:
                  event: esphome.rf_fan_received
                  data_template:
                    device: ${device_name}
                    action: "sniff"
                    code: "{{ rc_code }}"
                  variables:
                    # Rebuild the bit string over the declared width. Returning
                    # x.code directly yields its DECIMAL representation, which
                    # is not a bit string and cannot be replayed.
                    rc_code: !lambda |-
                      const int nbits = ${rc_code_bits};
                      std::string bits;
                      bits.reserve(nbits);
                      for (int i = nbits - 1; i >= 0; i--)
                        bits += ((x.code >> i) & 1) ? '1' : '0';
                      // Remote sends N+1 bits but rc_switch only ever reports
                      // N? The decoder stops at the first pulse pair it cannot
                      // match, and on some remotes the final bit runs straight
                      // into the inter-frame gap, so it is dropped. Set
                      // rc_code_bits to what IS decoded and rebuild the missing
                      // trailing bit here. Example, for a 30-bit frame whose
                      // last bit is an even parity over the other 29:
                      //   int ones = 0;
                      //   for (char c : bits) ones += (c == '1');
                      //   bits += (ones & 1) ? '1' : '0';
                      return std::to_string(x.protocol) + ":" + bits;
